<!doctype html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ItTime">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>ItTime</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="brand">ItTime</div>
      <div class="subtitle">Work. Rest. Remember why.</div>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </header>
  <main id="app"></main>
  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-tab="today" aria-label="Today"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span><span>Today</span></button>
    <button class="tab" data-tab="history" aria-label="History"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg></span><span>History</span></button>
    <button class="tab" data-tab="insights" aria-label="Insights"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19V11"/><path d="M12 19V5"/><path d="M19 19v-8"/></svg></span><span>Insights</span></button>
    <button class="tab" data-tab="settings" aria-label="Settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.6 1.6-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.6-1.6.1-.1A1.7 1.7 0 0 0 8.6 15a1.7 1.7 0 0 0-1.5-1H7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.6-1.6.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.4 1z"/></svg></span><span>Settings</span></button>
  </nav>
</div>
<div id="modalRoot"></div>
<script src="app.js"></script>
<script src="push-fix.js"></script>
</body>
</html>
